<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Usuários — OOMC</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1a19;--surface:#112220;--surface2:#163330;--border:#1e3836;--border2:#2a4f4c;
    --text:#e8f4f3;--muted:#7aaba7;
    --primary:#009B91;--primary-bg:#0d2e2c;--primary-dark:#005852;
    --red:#e05a4e;--red-bg:#2d0f0d;--red-border:#7a2020;
    --green:#009B91;--green-bg:#0d2e2c;--green-border:#005852;
  }
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:20px}
  .wrap{max-width:880px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
  header h1{font-size:1.1rem;font-weight:700}
  header span{font-size:.78rem;color:var(--muted)}
  .nav-links{display:flex;gap:8px}
  .nav-link{font-size:.8rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px}
  .nav-link:hover{border-color:var(--primary);color:var(--primary)}
  .btn-novo{background:var(--primary);color:#fff;border:none;border-radius:9px;padding:10px 18px;font-size:.85rem;font-weight:700;cursor:pointer;margin-bottom:16px}
  .btn-novo:hover{opacity:.88}

  .user-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  .user-info{display:flex;flex-direction:column;gap:3px;min-width:200px}
  .user-nome{font-weight:700;font-size:.95rem}
  .user-login{font-size:.75rem;color:var(--muted)}
  .user-badge{font-size:.65rem;padding:2px 7px;border-radius:5px;display:inline-block;margin-top:4px;width:fit-content}
  .user-badge.ativo{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
  .user-badge.inativo{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
  .online-dot{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--muted)}
  .online-dot .dot{width:7px;height:7px;border-radius:50%;background:var(--muted2)}
  .online-dot.on{color:var(--green)}
  .online-dot.on .dot{background:var(--green);box-shadow:0 0 0 0 var(--green);animation:pulseDot 1.6s infinite}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(0,155,145,.5)}70%{box-shadow:0 0 0 5px rgba(0,155,145,0)}100%{box-shadow:0 0 0 0 rgba(0,155,145,0)}}
  .user-perms{font-size:.7rem;color:var(--muted);max-width:340px}
  .user-actions{display:flex;gap:6px}
  .btn-icon{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:7px 11px;font-size:.78rem;cursor:pointer}
  .btn-icon:hover{border-color:var(--primary);color:var(--primary)}
  .btn-icon.danger:hover{border-color:var(--red);color:var(--red)}

  /* Modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
  #modal.hidden{display:none}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
  .modal-box h2{font-size:1rem;font-weight:700}
  .field label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:.88rem;outline:none}
  .field input:focus{border-color:var(--primary)}
  .field-row{display:flex;gap:10px}
  .field-row .field{flex:1}
  .perm-grupo{font-size:.68rem;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 6px}
  .perm-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:.85rem}
  .perm-item input{width:16px;height:16px;accent-color:var(--primary)}
  .modal-footer{display:flex;gap:8px;margin-top:6px}
  .btn-cancel{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:9px;padding:10px;font-size:.85rem;cursor:pointer}
  .btn-salvar{flex:1;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:10px;font-size:.85rem;font-weight:700;cursor:pointer}
  .btn-salvar:disabled{opacity:.4;cursor:default}
  .err{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);border-radius:8px;padding:8px 11px;font-size:.78rem;display:none}
  .toggle-ativo{display:flex;align-items:center;gap:8px;font-size:.82rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>👥 Gerenciar Usuários</h1>
      <span>Sistema OOMC</span>
    </div>
    <div class="nav-links">
      <a href="/" class="nav-link">🔧 Painel</a>
      <a href="/colaboradores.html" class="nav-link">👷 Colaboradores</a>
      <a href="/manutencao.html" class="nav-link">⚙️ Operação</a>
    </div>
  </header>

  <button class="btn-novo" onclick="abrirModal()">+ Novo Usuário</button>
  <div id="lista"></div>
</div>

<div id="modal" class="hidden">
  <div class="modal-box">
    <h2 id="modalTitulo">Novo Usuário</h2>
    <div class="err" id="modalErr"></div>
    <input type="hidden" id="editId"/>
    <div class="field-row">
      <div class="field"><label>Nome</label><input type="text" id="fNome"/></div>
      <div class="field"><label>Usuário (login)</label><input type="text" id="fUsername"/></div>
    </div>
    <div class="field">
      <label id="fSenhaLabel">Senha</label>
      <input type="password" id="fSenha" placeholder="Deixe em branco para não alterar"/>
    </div>
    <div id="permsWrap"></div>
    <div class="toggle-ativo" id="ativoWrap" style="display:none">
      <input type="checkbox" id="fAtivo" checked/> <label for="fAtivo">Usuário ativo</label>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btnSalvar" onclick="salvarUsuario()">Salvar</button>
    </div>
  </div>
</div>

<script>
  const TOKEN = localStorage.getItem('oomc_token');
  let PERMISSOES_INFO = [];
  let _usuarios = [];

  function authFetch(url, opts = {}) {
    opts.headers = { ...(opts.headers||{}), 'x-auth-token': TOKEN };
    return fetch(url, opts);
  }

  async function init() {
    if (!TOKEN) { location.href = '/login.html?redirect=/usuarios.html'; return; }
    const me = await authFetch('/api/auth/me').then(r=>r.json()).catch(()=>null);
    if (!me || !me.ok) { location.href = '/login.html?redirect=/usuarios.html'; return; }
    if (!me.usuario.permissoes.includes('gerenciar_usuarios')) {
      document.querySelector('.wrap').innerHTML = '<p style="padding:40px;text-align:center;color:var(--muted)">⚠️ Você não tem permissão para acessar esta página.</p>';
      return;
    }

    const pr = await fetch('/api/auth/permissoes-info').then(r=>r.json());
    PERMISSOES_INFO = pr.data || [];

    await carregarUsuarios();
    setInterval(carregarUsuarios, 30_000);
  }

  async function carregarUsuarios() {
    const r = await authFetch('/api/auth/usuarios').then(r=>r.json());
    _usuarios = r.data || [];
    renderLista();
  }

  function formatDataHora(s) {
    if (!s) return 'nunca';
    const [data, hora] = s.split(' ');
    const [y,m,d] = data.split('-');
    return `${d}/${m}/${y} às ${hora?.slice(0,5)}`;
  }

  function renderLista() {
    const el = document.getElementById('lista');
    el.innerHTML = _usuarios.map(u => `
      <div class="user-card">
        <div class="user-info">
          <div class="user-nome">${u.nome}</div>
          <div class="user-login">@${u.username}</div>
          <span class="user-badge ${u.ativo ? 'ativo':'inativo'}">${u.ativo ? '● Ativo':'● Inativo'}</span>
          <span class="online-dot ${u.online ? 'on' : ''}"><span class="dot"></span>${u.online ? 'Online agora' : 'Offline'}</span>
          <div class="user-perms">${u.permissoes.length} permissão(ões) · último login: ${formatDataHora(u.ultimo_login)}</div>
        </div>
        <div class="user-actions">
          ${u.online ? `<button class="btn-icon danger" onclick="desconectarUsuario(${u.id},'${u.nome.replace(/'/g,"\\'")}')">🔌 Desconectar</button>` : ''}
          <button class="btn-icon" onclick="editarUsuario(${u.id})">✏️ Editar</button>
          <button class="btn-icon danger" onclick="excluirUsuario(${u.id},'${u.nome.replace(/'/g,"\\'")}')">🗑️ Excluir</button>
        </div>
      </div>
    `).join('') || '<p style="color:var(--muted);text-align:center;padding:30px">Nenhum usuário cadastrado.</p>';
  }

  async function desconectarUsuario(id, nome) {
    if (!confirm('Desconectar "'+nome+'"? A pessoa vai precisar fazer login novamente.')) return;
    try {
      const r = await authFetch('/api/auth/usuarios/'+id+'/desconectar', { method:'POST' }).then(r=>r.json());
      if (!r.ok) throw new Error(r.error);
      await carregarUsuarios();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  function renderPermsCheckboxes(selecionadas = []) {
    const grupos = {};
    PERMISSOES_INFO.forEach(p => { (grupos[p.grupo] = grupos[p.grupo]||[]).push(p); });
    document.getElementById('permsWrap').innerHTML = Object.entries(grupos).map(([grupo, items]) => `
      <div class="perm-grupo">${grupo}</div>
      ${items.map(p => `
        <div class="perm-item">
          <input type="checkbox" id="perm_${p.key}" value="${p.key}" ${selecionadas.includes(p.key)?'checked':''}/>
          <label for="perm_${p.key}">${p.label}</label>
        </div>
      `).join('')}
    `).join('');
  }

  function getPermsSelecionadas() {
    return PERMISSOES_INFO.map(p=>p.key).filter(k => document.getElementById('perm_'+k)?.checked);
  }

  function abrirModal() {
    document.getElementById('modalTitulo').textContent = 'Novo Usuário';
    document.getElementById('editId').value = '';
    document.getElementById('fNome').value = '';
    document.getElementById('fUsername').value = '';
    document.getElementById('fSenha').value = '';
    document.getElementById('fSenha').placeholder = '';
    document.getElementById('fSenhaLabel').textContent = 'Senha';
    document.getElementById('fUsername').disabled = false;
    document.getElementById('ativoWrap').style.display = 'none';
    document.getElementById('modalErr').style.display = 'none';
    renderPermsCheckboxes([]);
    document.getElementById('modal').classList.remove('hidden');
  }

  function editarUsuario(id) {
    const u = _usuarios.find(x => x.id === id);
    if (!u) return;
    document.getElementById('modalTitulo').textContent = 'Editar Usuário';
    document.getElementById('editId').value = u.id;
    document.getElementById('fNome').value = u.nome;
    document.getElementById('fUsername').value = u.username;
    document.getElementById('fUsername').disabled = true;
    document.getElementById('fSenha').value = '';
    document.getElementById('fSenha').placeholder = 'Deixe em branco para não alterar';
    document.getElementById('fSenhaLabel').textContent = 'Nova senha (opcional)';
    document.getElementById('ativoWrap').style.display = 'flex';
    document.getElementById('fAtivo').checked = u.ativo;
    document.getElementById('modalErr').style.display = 'none';
    renderPermsCheckboxes(u.permissoes);
    document.getElementById('modal').classList.remove('hidden');
  }

  function fecharModal() {
    document.getElementById('modal').classList.add('hidden');
  }

  async function salvarUsuario() {
    const id       = document.getElementById('editId').value;
    const nome     = document.getElementById('fNome').value.trim();
    const username = document.getElementById('fUsername').value.trim();
    const senha    = document.getElementById('fSenha').value;
    const permissoes = getPermsSelecionadas();
    const errEl = document.getElementById('modalErr');
    errEl.style.display = 'none';

    if (!nome || !username) { errEl.textContent = 'Nome e usuário são obrigatórios.'; errEl.style.display='block'; return; }
    if (!id && !senha) { errEl.textContent = 'Defina uma senha para o novo usuário.'; errEl.style.display='block'; return; }

    const btn = document.getElementById('btnSalvar');
    btn.disabled = true; btn.textContent = 'Salvando...';

    try {
      let r;
      if (id) {
        const body = { nome, permissoes, ativo: document.getElementById('fAtivo').checked };
        if (senha) body.senha = senha;
        r = await authFetch('/api/auth/usuarios/'+id, {
          method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
        }).then(r=>r.json());
      } else {
        r = await authFetch('/api/auth/usuarios', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ nome, username, senha, permissoes })
        }).then(r=>r.json());
      }
      if (!r.ok) throw new Error(r.error);
      fecharModal();
      await carregarUsuarios();
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Salvar';
  }

  async function excluirUsuario(id, nome) {
    if (!confirm('Excluir o usuário "'+nome+'"? Essa ação não pode ser desfeita.')) return;
    try {
      const r = await authFetch('/api/auth/usuarios/'+id, { method:'DELETE' }).then(r=>r.json());
      if (!r.ok) throw new Error(r.error);
      await carregarUsuarios();
    } catch(e) { alert('Erro: ' + e.message); }
  }

  document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) fecharModal(); });

  init();
</script>
</body>
</html>
