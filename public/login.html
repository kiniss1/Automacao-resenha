<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — OOMC</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1a19;--surface:#112220;--border:#1e3836;
    --text:#e8f4f3;--muted:#7aaba7;
    --primary:#009B91;--primary-dark:#005852;
    --red:#e05a4e;--red-bg:#2d0f0d;--red-border:#7a2020;
  }
  body{background:radial-gradient(ellipse at bottom, #0d2e2c 0%, #050d0c 100%);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;position:relative}
  .sp-stars{position:absolute;inset:0;overflow:hidden;z-index:0}
  .sp-stars1,.sp-stars2,.sp-stars3{position:absolute;background:transparent}
  .sp-stars1{width:1px;height:1px;animation:spAnimStar 50s linear infinite;box-shadow:501px 811px #fff,1450px 1324px #fff,1093px 1780px #fff,1469px 678px #fff,904px 741px #fff,1160px 781px #fff,1841px 1962px #fff,1630px 1667px #fff,1788px 676px #fff,367px 1734px #fff,1343px 156px #fff,1283px 1142px #fff,1062px 378px #fff,1395px 467px #fff,1017px 1891px #fff,137px 1114px #fff,1767px 1403px #fff,1543px 11px #fff,1078px 181px #fff,1189px 1574px #fff,1697px 1551px #fff,439px 472px #fff,1491px 677px #fff,1364px 599px #fff,34px 382px #fff,1221px 1584px #fff,1266px 1499px #fff,169px 1907px #fff,1219px 1125px #fff,659px 18px #fff,1731px 1959px #fff,332px 1216px #fff,1913px 788px #fff,80px 712px #fff,326px 1605px #fff,574px 1502px #fff,473px 1653px #fff,404px 975px #fff,322px 1797px #fff,425px 1321px #fff,1121px 1797px #fff,731px 647px #fff,891px 1584px #fff,1523px 109px #fff,1379px 244px #fff,865px 1064px #fff,493px 956px #fff,624px 1380px #fff,440px 619px #fff,1630px 767px #fff,955px 1196px #fff,62px 729px #fff,126px 946px #fff,1256px 896px #fff,1444px 256px #fff,661px 1628px #fff,1078px 1716px #fff,300px 737px #fff,1734px 413px #fff,1296px 129px #fff,1771px 1678px #fff,977px 1764px #fff,1879px 549px #fff,665px 1531px #fff,89px 701px #fff,1084px 1183px #fff,1597px 1576px #fff,1354px 1774px #fff,554px 1471px #fff,1469px 287px #fff,887px 106px #fff,1962px 766px #fff,638px 805px #fff,1651px 741px #fff,1517px 1826px #fff,24px 1152px #fff,507px 558px #fff,1262px 652px #fff,246px 1048px #fff,1077px 421px #fff,1866px 1847px #fff,1986px 1561px #fff,704px 632px #fff,1991px 1875px #fff,1227px 395px #fff,45px 1116px #fff,247px 786px #fff,890px 607px #fff,787px 1235px #fff,557px 524px #fff,1582px 1285px #fff,1725px 1366px #fff,952px 747px #fff,251px 458px #fff,1500px 1250px #fff,1999px 1734px #fff,1336px 1955px #fff,1705px 1464px #fff,728px 697px #fff,594px 510px #fff,1345px 1990px #fff,1919px 1803px #fff,1117px 966px #fff,1629px 97px #fff}
  .sp-stars1::after{content:" ";position:absolute;top:2000px;width:1px;height:1px;background:transparent;box-shadow:inherit}
  .sp-stars2{width:2px;height:2px;animation:spAnimStar 100s linear infinite;box-shadow:1925px 1320px #fff,693px 1778px #fff,1016px 711px #fff,1171px 563px #fff,661px 1919px #fff,1610px 44px #fff,1275px 140px #fff,1208px 1802px #fff,1473px 1587px #fff,11px 1117px #fff,853px 1757px #fff,1149px 937px #fff,1353px 428px #fff,270px 279px #fff,258px 1404px #fff,417px 1188px #fff,286px 561px #fff,393px 1765px #fff,147px 881px #fff,666px 1097px #fff,1425px 1278px #fff,806px 156px #fff,1252px 561px #fff,218px 52px #fff,1371px 1980px #fff,171px 745px #fff,1424px 89px #fff,137px 244px #fff,939px 1922px #fff,137px 1080px #fff,1757px 50px #fff,904px 536px #fff,1938px 1001px #fff,1172px 440px #fff,72px 1475px #fff,102px 121px #fff,804px 1671px #fff,1314px 270px #fff,440px 1341px #fff,1216px 511px #fff,1061px 1523px #fff,97px 274px #fff,704px 1318px #fff,52px 1872px #fff,1962px 296px #fff,111px 289px #fff,1157px 1236px #fff,1347px 1451px #fff,820px 286px #fff,1389px 1169px #fff,644px 841px #fff}
  .sp-stars2::after{content:" ";position:absolute;top:2000px;width:2px;height:2px;background:transparent;box-shadow:inherit}
  .sp-stars3{width:3px;height:3px;animation:spAnimStar 150s linear infinite;box-shadow:200px 981px #fff,1731px 521px #fff,132px 1039px #fff,1888px 1547px #fff,899px 1226px #fff,1887px 580px #fff,1548px 1092px #fff,1626px 689px #fff,254px 1072px #fff,1684px 1211px #fff,672px 1267px #fff,939px 668px #fff,1969px 645px #fff,1126px 983px #fff,457px 568px #fff,476px 876px #fff,829px 1896px #fff,1364px 1846px #fff,1507px 1120px #fff,936px 1948px #fff,1833px 832px #fff,1424px 285px #fff,1377px 1596px #fff,432px 153px #fff}
  .sp-stars3::after{content:" ";position:absolute;top:2000px;width:3px;height:3px;background:transparent;box-shadow:inherit}
  @keyframes spAnimStar{from{transform:translateY(0)}to{transform:translateY(-2000px)}}
  .box{position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
  .logo-wrap{position:relative;width:56px;height:56px;margin:0 auto 6px}
  .logo{width:56px;height:56px;background:var(--primary);border-radius:14px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
  .pulse-ring{position:absolute;inset:0;border-radius:14px;border:1.5px solid var(--primary);opacity:0;animation:pulseRingLogin 2.6s cubic-bezier(.2,.6,.4,1) infinite}
  .pulse-ring.r2{animation-delay:1.3s}
  @keyframes pulseRingLogin{0%{transform:scale(1);opacity:.65}100%{transform:scale(2.15);opacity:0}}
  h1{font-size:1.15rem;font-weight:800;text-align:center}
  p.sub{font-size:.78rem;color:var(--muted);text-align:center;margin-top:-8px}
  .field label{display:block;font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 13px;font-size:.92rem;outline:none}
  .field input:focus{border-color:var(--primary)}
  .btn{background:var(--primary);color:#fff;border:none;border-radius:9px;padding:12px;font-size:.92rem;font-weight:700;cursor:pointer;transition:opacity .15s}
  .btn:hover{opacity:.88}
  .btn:disabled{opacity:.4;cursor:default}
  .err{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red);border-radius:8px;padding:9px 12px;font-size:.8rem;display:none}
  .brand-logo-svg{color:#fff;overflow:visible}
  .brand-logo-svg .ring-arc{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:logoLoopDraw 2.4s ease-in-out infinite}
  .brand-logo-svg .ring-arc2{animation-delay:.2s}
  .brand-logo-svg .bolt{fill:currentColor;stroke:currentColor;stroke-width:1;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;fill-opacity:0;animation:logoLoopDraw 2.4s ease-in-out infinite .45s,logoLoopFill 2.4s ease-in-out infinite}
  @keyframes logoLoopDraw{0%{stroke-dashoffset:100}20%{stroke-dashoffset:0}75%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:100}}
  @keyframes logoLoopFill{0%,38%{fill-opacity:0}58%,78%{fill-opacity:1}92%,100%{fill-opacity:0}}
</style>
</head>
<body>
  <div class="sp-stars" aria-hidden="true">
    <div class="sp-stars1"></div>
    <div class="sp-stars2"></div>
    <div class="sp-stars3"></div>
  </div>
  <div class="box">
    <div class="logo-wrap">
      <div class="pulse-ring"></div>
      <div class="pulse-ring r2"></div>
      <div class="logo">
        <svg class="brand-logo-svg" width="26" height="26" viewBox="0 0 24 24">
          <path class="ring-arc" pathLength="100" d="M16.55 4.23 A9 9 0 0 1 11.95 21"/>
          <path class="ring-arc ring-arc2" pathLength="100" d="M7.43 19.76 A9 9 0 0 1 12.05 3"/>
          <path class="bolt" pathLength="100" d="M15 1 L5 13 L12 13 L9 23 L19 11 L12 11 Z"/>
        </svg>
      </div>
    </div>
    <h1>Sistema OOMC</h1>
    <p class="sub">Manutenção Alta Tensão</p>
    <div class="err" id="err"></div>
    <div class="field">
      <label>Usuário</label>
      <input type="text" id="username" autocomplete="username" onkeydown="if(event.key==='Enter') fazerLogin()"/>
    </div>
    <div class="field">
      <label>Senha</label>
      <input type="password" id="senha" autocomplete="current-password" onkeydown="if(event.key==='Enter') fazerLogin()"/>
    </div>
    <button class="btn" id="btnLogin" onclick="fazerLogin()">Entrar</button>
  </div>

<script>
  async function fazerLogin() {
    const username = document.getElementById('username').value.trim();
    const senha    = document.getElementById('senha').value;
    const errEl    = document.getElementById('err');
    const btn      = document.getElementById('btnLogin');
    errEl.style.display = 'none';
    if (!username || !senha) {
      errEl.textContent = 'Informe usuário e senha.';
      errEl.style.display = 'block';
      return;
    }
    btn.disabled = true; btn.textContent = 'Entrando...';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, senha })
      }).then(r => r.json());
      if (!r.ok) throw new Error(r.error || 'Usuário ou senha incorretos.');
      localStorage.setItem('oomc_token', r.token);
      localStorage.setItem('oomc_usuario', JSON.stringify(r.usuario));
      const redirect = new URLSearchParams(location.search).get('redirect') || '/';
      location.href = redirect;
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  }
</script>
</body>
</html>
