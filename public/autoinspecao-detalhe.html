<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Autoinspeção — Detalhe — OOMC</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1a19;--surface:#112220;--border:#1e3836;
    --text:#e8f4f3;--muted:#7aaba7;
    --primary:#009B91;--primary-bg:#0d2e2c;
    --green:#009B91;--green-bg:#0d2e2c;--green-border:#005852;
    --red:#e05a4e;--red-bg:#2d0f0d;--red-border:#7a2020;
  }
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:20px}
  .wrap{max-width:640px;margin:0 auto}
  .header-card{background:var(--primary);border-radius:12px;padding:18px 20px;margin-bottom:20px;color:#fff}
  .header-card .tag{font-size:.7rem;font-weight:700;letter-spacing:.1em;opacity:.8;margin-bottom:4px}
  .header-card .nome{font-size:1.2rem;font-weight:800}
  .header-card .meta{font-size:.8rem;opacity:.85;margin-top:4px}
  .item-row{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .item-label{font-size:.85rem}
  .item-val{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:6px}
  .item-val.bom{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
  .item-val.ruim{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
  .item-venc{font-size:.68rem;color:var(--muted);margin-top:2px}
  .vazio{text-align:center;color:var(--muted);padding:60px 20px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <p class="vazio">Carregando...</p>
</div>

<script>
  async function init() {
    const id = new URLSearchParams(location.search).get('id');
    const wrap = document.getElementById('wrap');
    if (!id) { wrap.innerHTML = '<p class="vazio">Nenhuma inspeção especificada.</p>'; return; }
    try {
      const r = await fetch('/api/autoinspecao/preenchimentos/' + id).then(r=>r.json());
      if (!r.ok || !r.data) { wrap.innerHTML = '<p class="vazio">Inspeção não encontrada.</p>'; return; }
      const p = r.data;
      const ruimSet = ['RUIM','VENCIDA','VENCIDO'];
      wrap.innerHTML = `
        <div class="header-card">
          <div class="tag">AUTOINSPEÇÃO DE EPI</div>
          <div class="nome">${p.nome_tecnico || p.matricula}</div>
          <div class="meta">Mat. ${p.matricula} · ${p.data_insp}${p.hora_insp ? ' às ' + p.hora_insp : ''}</div>
        </div>
        ${(p.respostas||[]).map(resp => {
          const irregular = ruimSet.includes((resp.resposta_opcao||'').toUpperCase());
          return `
            <div class="item-row">
              <div>
                <div class="item-label">${resp.label}</div>
                ${resp.validade_data ? `<div class="item-venc">Validade: ${resp.validade_data}</div>` : ''}
              </div>
              <span class="item-val ${irregular ? 'ruim' : 'bom'}">${resp.resposta_opcao || '—'}</span>
            </div>
          `;
        }).join('') || '<p class="vazio">Nenhum item respondido.</p>'}
      `;
    } catch(e) { wrap.innerHTML = '<p class="vazio">Erro ao carregar: ' + e.message + '</p>'; }
  }
  init();
</script>
</body>
</html>
