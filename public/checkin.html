<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Check-in / Check-out</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d1a19;--surface:#112220;--surface2:#163330;--border:#1e3836;--border2:#2a4f4c;
      --text:#e8f4f3;--muted:#7aaba7;--muted2:#4a7572;
      --primary:#009B91;--primary-bg:#0d2e2c;--primary-dark:#005852;
      --green:#009B91;--green-bg:#0d2e2c;--green-border:#005852;
      --orange:#F5AA41;--orange-bg:#2d1f00;--orange-border:#EB8C0A;
      --gray:#7F7F7F;--gray-bg:#1e1e1e;--gray-border:#414141;
      --red:#e05a4e;--red-bg:#2d0f0d;--red-border:#7a2020;
      --violet:#50EBE1;--violet-bg:#0d2e2c;--violet-border:#009B91;
      --cyan:#50EBE1;--beige:#FACD91;
    }
    body.light{
      --bg:#f4fafa;--surface:#ffffff;--surface2:#edf7f6;--border:#CDCDCD;--border2:#b0cece;
      --text:#414141;--muted:#7F7F7F;--muted2:#CDCDCD;
      --primary:#009B91;--primary-bg:#e0f5f4;--primary-dark:#005852;
      --green:#005852;--green-bg:#e0f5f4;--green-border:#009B91;
      --orange:#F5AA41;--orange-bg:#fff4e0;--orange-border:#EB8C0A;
      --gray:#7F7F7F;--gray-bg:#f0f0f0;--gray-border:#CDCDCD;
      --red:#c0392b;--red-bg:#fdecea;--red-border:#e57373;
      --violet:#009B91;--violet-bg:#e0f5f4;--violet-border:#005852;
      --cyan:#50EBE1;--beige:#FACD91;
    }
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:20px}

    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:460px;padding:24px;display:flex;flex-direction:column;gap:18px}

    .card-header{text-align:center}
    .sub-badge{display:inline-block;background:var(--primary);color:#fff;font-size:.75rem;font-weight:700;padding:4px 14px;border-radius:999px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
    .card-header h1{font-size:1.25rem;font-weight:700}
    .card-header p{font-size:.82rem;color:var(--muted);margin-top:4px}

    .tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:10px;overflow:hidden}
    .tab{flex:1;background:transparent;border:none;color:var(--muted);padding:10px;font-size:.85rem;cursor:pointer;transition:background .15s,color .15s;font-weight:600}
    .tab.active{background:var(--primary);color:#fff}

    .panel{display:none}
    .panel.active{display:flex;flex-direction:column;gap:14px}

    .field{display:flex;flex-direction:column;gap:6px}
    .field label{font-size:.8rem;font-weight:600;color:var(--muted)}
    .field input,.field select,.field textarea{
      background:var(--bg);border:1px solid var(--border);color:var(--text);
      border-radius:8px;padding:12px 14px;font-size:1rem;outline:none;width:100%;
      transition:border-color .15s;font-family:Arial,sans-serif;
    }
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
    .field textarea{resize:none;height:72px}

    /* Colaboradores */
    .colab-list{display:flex;flex-direction:column;gap:8px}
    .colab-row{display:flex;gap:8px;align-items:center}
    .colab-row input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:.95rem;outline:none}
    .colab-row input:focus{border-color:var(--primary)}
    .colab-row input.identified{border-color:var(--green);color:var(--green)}
    .colab-row input.error{border-color:var(--red)}
    .colab-name{font-size:.72rem;color:var(--green);margin-top:2px;min-height:16px;padding-left:2px}
    .colab-name.error{color:var(--red)}
    .colab-wrap{flex:1;display:flex;flex-direction:column}

    .btn-add-colab{background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:8px;font-size:.82rem;cursor:pointer;transition:all .15s;width:100%;text-align:center}
    .btn-add-colab:hover{border-color:var(--primary);color:var(--primary)}

    .btn-remove{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:8px 10px;font-size:.8rem;cursor:pointer;line-height:1;flex-shrink:0;transition:background .15s}
    .btn-remove:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}

    .btn{width:100%;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:opacity .15s}
    .btn:hover{opacity:.88}
    .btn:disabled{opacity:.4;cursor:default}
    .btn-checkin{background:var(--green);color:#fff}
    .btn-checkout{background:var(--red);color:#fff}

    .result{border-radius:10px;padding:14px 16px;font-size:.88rem;line-height:1.7;display:none;white-space:pre-wrap}
    .result.ok  {background:var(--green-bg); border:1px solid #14532d; color:var(--green)}
    .result.err {background:var(--red-bg);   border:1px solid #7f1d1d; color:var(--red)}
    .result.warn{background:var(--orange-bg);border:1px solid #7c2d12; color:var(--orange)}
    .result.show{display:block}

    .ativos-box{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;display:none}
    .ativos-box.show{display:block}
    .ativos-title{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
    .ativo-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:.82rem}
    .ativo-item:last-child{border-bottom:none}
    .ativo-nome{font-weight:600}
    .ativo-sub{color:var(--primary);font-size:.75rem}
    .ativo-hora{color:var(--muted);font-size:.72rem}

    .checkout-ativos{display:flex;flex-direction:column;gap:8px}
    .checkout-item{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;gap:10px}
    .checkout-item-info{display:flex;flex-direction:column;gap:2px}
    .checkout-item-nome{font-size:.9rem;font-weight:600}
    .checkout-item-det{font-size:.75rem;color:var(--muted)}
    .checkout-item-btn{background:var(--red);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap}
    .checkout-item-btn:hover{opacity:.85}
    .checkout-empty{font-size:.85rem;color:var(--muted);text-align:center;padding:20px 0}
  </style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="sub-badge" id="subBadge">⚡ Subestação</div>
    <h1>Check-in / Check-out</h1>
    <p>OOMC — Manutenção Alta Tensão</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab('checkin')">▶ Entrada</button>
    <button class="tab" onclick="setTab('checkout')">◀ Saída</button>
  </div>

  <!-- CHECKIN -->
  <div class="panel active" id="panelCheckin">
    <div class="field">
      <label>Subestação</label>
      <select id="subIn"></select>
    </div>

    <div class="field">
      <label>Colaboradores (matrícula) — adicione todos da equipe</label>
      <div class="colab-list" id="colabList"></div>
      <button class="btn-add-colab" onclick="addColabRow()" id="btnAddColab">+ Adicionar colaborador</button>
    </div>

    <div class="field">
      <label>Atividade a executar</label>
      <textarea id="atividadeIn" placeholder="Descreva a atividade..."></textarea>
    </div>

    <button class="btn btn-checkin" id="btnCheckin" onclick="doCheckin()">✅ Registrar Entrada</button>
  </div>

  <!-- CHECKOUT -->
  <div class="panel" id="panelCheckout">
    <div class="field">
      <label>Subestação</label>
      <select id="subOut"></select>
    </div>
    <div id="checkoutAtivos" class="checkout-ativos">
      <div class="checkout-empty">Selecione a subestação para ver quem está em campo.</div>
    </div>
  </div>

  <div class="result" id="result"></div>

  <div class="ativos-box" id="ativosBox">
    <div class="ativos-title">🟢 Em campo agora nesta subestação</div>
    <div id="ativosList"></div>
  </div>
</div>

<script>
  const params  = new URLSearchParams(location.search);
  const subParam = (params.get('sub') || '').toUpperCase();
  const MAX_COLAB = 6;

  // ── Init ──────────────────────────────────────────────────────────────────
  fetch('/api/subestacoes').then(r=>r.json()).then(({data}) => {
    [document.getElementById('subIn'), document.getElementById('subOut')].forEach(sel => {
      data.forEach(s => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        if (s === subParam) o.selected = true;
        sel.appendChild(o);
      });
    });
    document.getElementById('subBadge').textContent = '⚡ ' + (subParam || data[0]);
    if (subParam) {
      loadAtivos(subParam);
      loadCheckoutAtivos(subParam);
    }
  });

  document.getElementById('subIn').addEventListener('change', function() {
    loadAtivos(this.value);
  });

  document.getElementById('subOut').addEventListener('change', function() {
    loadCheckoutAtivos(this.value);
  });

  // Inicia com 1 campo de matrícula
  addColabRow();

  // ── Colaboradores dinâmicos ───────────────────────────────────────────────
  function addColabRow() {
    const list = document.getElementById('colabList');
    if (list.children.length >= MAX_COLAB) return;

    const idx = list.children.length;
    const wrap = document.createElement('div');
    wrap.className = 'colab-wrap';
    wrap.innerHTML = `
      <div class="colab-row">
        <input type="number" inputmode="numeric" placeholder="Matrícula ${idx === 0 ? '(responsável)' : (idx + 1) + 'º colaborador'}"
          oninput="lookupColab(this)" class="colab-input" data-idx="${idx}"/>
        ${idx > 0 ? `<button class="btn-remove" onclick="removeColab(this)" title="Remover">✕</button>` : ''}
      </div>
      <div class="colab-name" id="colabName${idx}"></div>
    `;
    list.appendChild(wrap);

    // Oculta botão de adicionar se atingiu o máximo
    document.getElementById('btnAddColab').style.display =
      list.children.length >= MAX_COLAB ? 'none' : '';
  }

  function removeColab(btn) {
    btn.closest('.colab-wrap').remove();
    // Renumera placeholders
    document.querySelectorAll('.colab-input').forEach((inp, i) => {
      inp.placeholder = i === 0 ? 'Matrícula (responsável)' : `${i + 1}º colaborador`;
      inp.dataset.idx = i;
      const nameEl = inp.closest('.colab-wrap').querySelector('.colab-name');
      if (nameEl) nameEl.id = `colabName${i}`;
    });
    document.getElementById('btnAddColab').style.display = '';
  }

  async function lookupColab(inp) {
    const mat = inp.value.trim();
    const nameEl = inp.closest('.colab-wrap').querySelector('.colab-name');
    if (mat.length >= 4) {
      const {data} = await fetch('/api/colaborador/' + mat).then(r=>r.json());
      if (data) {
        inp.classList.add('identified'); inp.classList.remove('error');
        nameEl.textContent = '✓ ' + data.nome; nameEl.className = 'colab-name';
      } else {
        inp.classList.add('error'); inp.classList.remove('identified');
        nameEl.textContent = '✗ Matrícula não encontrada'; nameEl.className = 'colab-name error';
      }
    } else {
      inp.classList.remove('identified','error');
      nameEl.textContent = '';
    }
  }

  // ── Checkin ───────────────────────────────────────────────────────────────
  async function doCheckin() {
    const subestacao = document.getElementById('subIn').value;
    const atividade  = document.getElementById('atividadeIn').value.trim();
    const matriculas = [...document.querySelectorAll('.colab-input')]
      .map(i => i.value.trim()).filter(Boolean);

    if (!matriculas.length) { showResult('Informe pelo menos uma matrícula.', 'err'); return; }
    if (!atividade) { showResult('Descreva a atividade a executar.', 'err'); return; }

    const btn = document.getElementById('btnCheckin');
    btn.disabled = true; btn.textContent = '⏳ Registrando...';

    const resultados = [];
    const erros = [];

    for (const matricula of matriculas) {
      try {
        const res = await fetch('/api/checkin', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ matricula, subestacao, atividade })
        }).then(r=>r.json());

        if (res.erro) erros.push(`✗ ${res.msg}`);
        else resultados.push(`✓ ${res.nome || matricula}`);
      } catch(e) { erros.push(`✗ Erro ao registrar matrícula ${matricula}`); }
    }

    let msg = '';
    if (resultados.length) msg += `✅ Entradas registradas em ${subestacao}:\n${resultados.join('\n')}`;
    if (erros.length) msg += (msg ? '\n\n' : '') + `⚠️ Problemas:\n${erros.join('\n')}`;

    const type = erros.length && !resultados.length ? 'err' : resultados.length && erros.length ? 'warn' : 'ok';
    showResult(msg, type);

    if (resultados.length) {
      // Limpa campos
      document.getElementById('atividadeIn').value = '';
      document.querySelectorAll('.colab-input').forEach(i => {
        i.value = ''; i.classList.remove('identified','error');
      });
      document.querySelectorAll('.colab-name').forEach(n => n.textContent = '');
      loadAtivos(subestacao);
      loadCheckoutAtivos(subestacao);
    }

    btn.disabled = false; btn.textContent = '✅ Registrar Entrada';
  }

  // ── Checkout por lista ────────────────────────────────────────────────────
  async function loadCheckoutAtivos(sub) {
    const box = document.getElementById('checkoutAtivos');
    if (!sub) return;
    try {
      const {data} = await fetch('/api/checkin/ativos?sub=' + sub).then(r=>r.json());
      if (!data || !data.length) {
        box.innerHTML = '<div class="checkout-empty">Nenhum colaborador em campo nesta subestação.</div>';
        return;
      }
      box.innerHTML = data.map(c => `
        <div class="checkout-item" id="ci-${c.id}">
          <div class="checkout-item-info">
            <div class="checkout-item-nome">${c.nome || c.matricula}</div>
            <div class="checkout-item-det">${c.subestacao} · desde ${c.entrada.split(' ')[1] || c.entrada}</div>
            <div class="checkout-item-det" style="color:var(--muted)">${c.atividade || '—'}</div>
          </div>
          <button class="checkout-item-btn" onclick="doCheckout('${c.matricula}', '${c.subestacao}', this)">Registrar Saída</button>
        </div>
      `).join('');
    } catch(e) { box.innerHTML = '<div class="checkout-empty">Erro ao carregar.</div>'; }
  }

  async function doCheckout(matricula, subestacao, btn) {
    btn.disabled = true; btn.textContent = '⏳';
    try {
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ matricula })
      }).then(r=>r.json());

      if (res.erro) { showResult('⚠️ ' + res.msg, 'warn'); btn.disabled=false; btn.textContent='Registrar Saída'; }
      else {
        const item = document.getElementById('ci-' + res.checkin.id);
        if (item) item.remove();
        showResult(`✅ Saída registrada!\n${res.checkin.nome || matricula} saiu de ${subestacao}`, 'ok');
        loadAtivos(subestacao);
        // Se não tem mais itens
        if (!document.getElementById('checkoutAtivos').children.length) {
          loadCheckoutAtivos(subestacao);
        }
      }
    } catch(e) { showResult('Erro de conexão.', 'err'); btn.disabled=false; btn.textContent='Registrar Saída'; }
  }

  // ── Ativos na subestação ──────────────────────────────────────────────────
  async function loadAtivos(sub) {
    try {
      const {data} = await fetch('/api/checkin/ativos?sub=' + sub).then(r=>r.json());
      const box = document.getElementById('ativosBox');
      const list = document.getElementById('ativosList');
      if (!data || !data.length) { box.classList.remove('show'); return; }
      list.innerHTML = data.map(c => `
        <div class="ativo-item">
          <div>
            <div class="ativo-nome">${c.nome || c.matricula}</div>
            <div class="ativo-sub">${c.subestacao} · ${c.atividade || '—'}</div>
          </div>
          <div class="ativo-hora">${(c.entrada||'').split(' ')[1] || c.entrada}</div>
        </div>
      `).join('');
      box.classList.add('show');
    } catch(e) {}
  }

  function setTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&tab==='checkin')||(i===1&&tab==='checkout')));
    document.getElementById('panelCheckin').classList.toggle('active', tab==='checkin');
    document.getElementById('panelCheckout').classList.toggle('active', tab==='checkout');
    hideResult();
    if (tab === 'checkout') {
      const sub = document.getElementById('subOut').value;
      if (sub) loadCheckoutAtivos(sub);
    }
  }

  function showResult(msg, type) {
    const el = document.getElementById('result');
    el.textContent = msg; el.className = 'result show ' + type;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 8000);
  }

  function hideResult() { document.getElementById('result').classList.remove('show'); }
</script>
</body>
</html>
