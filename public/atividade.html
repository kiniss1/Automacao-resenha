<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Registro de Atividade</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3e;--text:#e2e8f0;--muted:#8892a4;
      --primary:#4f6ef7;--green:#22c55e;--red:#ef4444;--orange:#f97316;--gray:#94a3b8;
      --green-bg:#052e16;--orange-bg:#431407;--gray-bg:#1e293b;--red-bg:#450a0a;
      --violet:#a5b4fc;--violet-bg:#1e1b4b;
    }
    body.light{--bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--green-bg:#dcfce7;--orange-bg:#ffedd5;--gray-bg:#f1f5f9;--red-bg:#fee2e2}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:20px;display:flex;justify-content:center}
    .page{width:100%;max-width:520px;display:flex;flex-direction:column;gap:0}

    .page-header{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;padding:16px 24px;border-bottom:none}
    .page-header-top{display:flex;justify-content:flex-end;margin-bottom:8px}
    .page-header h1{font-size:1.1rem;font-weight:700;text-align:center}
    .page-header p{font-size:.78rem;color:var(--muted);text-align:center;margin-top:3px}

    .type-tabs{display:flex;background:var(--surface);border-left:1px solid var(--border);border-right:1px solid var(--border);padding:0 24px 14px}
    .type-tab{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px;font-size:.85rem;cursor:pointer;font-weight:600;transition:all .15s}
    .type-tab:first-child{border-radius:8px 0 0 8px}
    .type-tab:last-child{border-radius:0 8px 8px 0;border-left:none}
    .type-tab.active-inicial{background:#052e16;border-color:var(--green);color:var(--green)}
    .type-tab.active-final{background:var(--orange-bg);border-color:var(--orange);color:var(--orange)}

    .card{background:var(--surface);border:1px solid var(--border);padding:18px 24px;display:flex;flex-direction:column;gap:12px;border-top:none}
    .card:last-of-type{border-radius:0 0 14px 14px}
    .section-label{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .locked-badge{font-size:.65rem;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-weight:500}

    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:.78rem;font-weight:600;color:var(--muted)}
    .field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:.95rem;outline:none;width:100%;transition:border-color .15s;font-family:inherit}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
    .field textarea{resize:none;height:68px}
    .field-row{display:flex;gap:10px}
    .field-row .field{flex:1}

    /* Locked fields */
    .locked input,.locked select,.locked textarea{
      opacity:.6;cursor:not-allowed;pointer-events:none;
      border-color:var(--border)!important;background:var(--bg)!important;
    }
    .locked{opacity:.85}

    /* OS Lookup */
    .lookup-card{background:var(--surface);border:2px solid var(--orange);border-left:4px solid var(--orange);padding:18px 24px;display:flex;flex-direction:column;gap:12px;border-top:none}
    .lookup-title{font-size:.85rem;font-weight:700;color:var(--orange);display:flex;align-items:center;gap:6px}
    .lookup-input{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:12px;font-size:1.1rem;outline:none;width:100%;transition:border-color .15s;font-family:monospace;font-weight:600;letter-spacing:.05em}
    .lookup-input:focus{border-color:var(--orange)}
    .lookup-input.ok{border-color:var(--green);color:var(--green)}
    .lookup-input.err{border-color:var(--red)}
    .lookup-result{border-radius:8px;padding:10px 12px;font-size:.82rem;line-height:1.7}
    .lookup-result.ok{background:var(--green-bg);border:1px solid #14532d;color:var(--green)}
    .lookup-result.err{background:var(--red-bg);border:1px solid #7f1d1d;color:var(--red)}
    .btn-load{background:var(--green);color:#fff;border:none;border-radius:8px;padding:10px;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s}
    .btn-load:hover{opacity:.88}

    /* Colaboradores */
    .colab-wrap{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
    .colab-row{display:flex;gap:6px;align-items:center}
    .colab-mat{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;font-size:.95rem;outline:none;transition:border-color .15s}
    .colab-mat:focus{border-color:var(--primary)}
    .colab-mat.ok{border-color:var(--green)}
    .colab-mat.err{border-color:var(--red)}
    .colab-hint{font-size:.72rem;padding-left:2px;min-height:14px}
    .colab-hint.ok{color:var(--green)}
    .colab-hint.err{color:var(--red)}
    .btn-remove{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:8px 10px;font-size:.8rem;cursor:pointer;flex-shrink:0}
    .btn-remove:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}
    .btn-add{background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:8px;padding:7px;font-size:.8rem;cursor:pointer;width:100%;text-align:center;transition:all .15s}
    .btn-add:hover{border-color:var(--primary);color:var(--primary)}

    /* OS items */
    .os-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:8px}
    .os-item-header{display:flex;justify-content:space-between;align-items:center}
    .os-item-num{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase}

    /* Trajeto */
    .trajeto-item{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
    .trajeto-item select,.trajeto-item input{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;font-size:.85rem;outline:none}
    .trajeto-item select{flex:1;min-width:140px}
    .trajeto-item input[type=time]{width:100px}
    .trajeto-item select.sub-sel{flex:0 0 90px}
    .trajeto-locked{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:.82rem;color:var(--muted);line-height:1.7;margin-bottom:6px;border-left:3px solid var(--border)}

    /* Status */
    .status-select{appearance:none;cursor:pointer;font-weight:600}
    .status-Andamento{border-color:var(--orange)!important;color:var(--orange)!important;background:var(--orange-bg)!important}
    .status-Concluído{border-color:var(--green)!important;color:var(--green)!important;background:var(--green-bg)!important}
    .status-Etapa\ Concluída{border-color:var(--violet)!important;color:var(--violet)!important;background:var(--violet-bg)!important}
    .status-Cancelado{border-color:var(--gray)!important;color:var(--gray)!important;background:var(--gray-bg)!important}

    .btn-submit{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:14px;font-size:1rem;font-weight:700;cursor:pointer;width:100%;transition:opacity .15s;margin-top:4px}
    .btn-submit:hover{opacity:.88}
    .btn-submit:disabled{opacity:.4;cursor:default}

    #resultArea{display:flex;flex-direction:column;gap:10px;margin-top:4px}
    .result-msg{border-radius:10px;padding:13px 16px;font-size:.88rem;line-height:1.7;white-space:pre-wrap}
    .result-msg.ok {background:var(--green-bg);border:1px solid #14532d;color:var(--green)}
    .result-msg.err{background:var(--red-bg);border:1px solid #7f1d1d;color:var(--red)}

    /* APR */
    .apr-card{background:var(--surface);border:1px solid var(--orange);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
    .apr-card.done{border-color:var(--green)}
    .apr-card-title{font-size:.85rem;font-weight:600;display:flex;align-items:center;justify-content:space-between}
    .apr-status{font-size:.72rem;font-weight:500}
    .apr-status.pendente{color:var(--orange)}
    .apr-status.enviada{color:var(--green)}
    .apr-sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .apr-side-title{font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:4px}
    .apr-preview{width:100%;border-radius:6px;border:1px solid var(--green);display:none;margin-bottom:6px}
    .apr-upload-row{display:flex;gap:6px}
    .apr-lbl{flex:1;border:1px dashed var(--border);border-radius:8px;padding:10px;text-align:center;cursor:pointer;font-size:.72rem;color:var(--muted);transition:border-color .15s;display:block}
    .apr-lbl:hover{border-color:var(--primary);color:var(--primary)}
    .apr-lbl.done{border-color:var(--green);border-style:solid;color:var(--green)}
    .apr-lbl input{display:none}
    .btn-apr-send{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px;font-size:.82rem;font-weight:600;cursor:pointer;width:100%;transition:opacity .15s}
    .btn-apr-send:hover{opacity:.88}
    .btn-apr-send:disabled{opacity:.4;cursor:default}
    .apr-done-msg{text-align:center;color:var(--green);font-size:.85rem;padding:8px}
    .btn-tema{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:.78rem;cursor:pointer}
  </style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <div class="page-header-top"><button class="btn-tema" id="btnTema" onclick="toggleTema()">🌙 Escuro</button></div>
    <h1>⚡ Registro de Atividade</h1>
    <p>OOMC — Manutenção Alta Tensão</p>
  </div>

  <div class="type-tabs">
    <button class="type-tab active-inicial" id="tabInicial" onclick="setTipo('inicial')">▶ Início</button>
    <button class="type-tab" id="tabFinal" onclick="setTipo('final')">◀ Final</button>
  </div>

  <!-- LOOKUP (só no Final) -->
  <div class="lookup-card" id="lookupCard" style="display:none">
    <div class="lookup-title">🔍 Digite o número da OS para carregar a atividade</div>
    <input type="text" class="lookup-input" id="lookupInput" inputmode="numeric"
      placeholder="Ex: 3257260621" oninput="onLookupInput(this.value)"/>
    <div id="lookupResult" style="display:none"></div>
  </div>

  <!-- Resenha -->
  <div class="card" id="cardResenha">
    <div class="section-label">
      📋 Resenha
      <span class="locked-badge" id="resenhaLockBadge" style="display:none">🔒 Preenchido do início</span>
    </div>
    <div class="field-row">
      <div class="field"><label>⚙️ Guarda</label>
        <select id="guarda" onchange="autoHorario()">
          <option>Manhã</option><option>Tarde</option><option>Noite</option><option>Técnicos da Guarda</option>
        </select></div>
      <div class="field"><label>⏰ Horário</label><input type="text" id="horario" placeholder="07h x 16h"/></div>
    </div>
    <div class="field-row">
      <div class="field"><label>📆 Dia</label>
        <select id="diaSemana">
          <option>Segunda-feira</option><option>Terça-feira</option><option>Quarta-feira</option>
          <option>Quinta-feira</option><option>Sexta-feira</option><option>Sábado</option><option>Domingo</option>
        </select></div>
      <div class="field"><label>📅 Data</label><input type="date" id="data"/></div>
    </div>
  </div>

  <!-- Equipe -->
  <div class="card" id="cardEquipe">
    <div class="section-label">
      👷 Equipe
      <span class="locked-badge" id="equipeLockBadge" style="display:none">🔒 Preenchido do início</span>
    </div>
    <div class="field"><label>Colaboradores (matrícula)</label>
      <div id="colabList"></div>
      <button class="btn-add" id="btnAddColab" onclick="addColab()">+ Adicionar colaborador</button>
    </div>
    <div class="field-row">
      <div class="field"><label>📱 Telefone</label><input type="tel" id="telefone" placeholder="Ex: 98980-0372"/></div>
      <div class="field"><label>🚔 Veículo</label><input type="text" id="veiculo" placeholder="Ex: 4679-5"/></div>
    </div>
  </div>

  <!-- Atividades Início -->
  <div class="card" id="cardOsInicial">
    <div class="section-label">🧰 Atividades</div>
    <div id="osList"></div>
    <button class="btn-add" onclick="addOS()">+ Adicionar atividade</button>
  </div>

  <!-- Atividades Final -->
  <div class="card" id="cardOsFinal" style="display:none">
    <div class="section-label">🧰 Finalizar Atividades</div>
    <div id="osListFinal"></div>
    <button class="btn-add" id="btnAddOsFinal" style="display:none" onclick="addOutraOS()">+ Carregar outra OS</button>
  </div>

  <!-- Trajeto -->
  <div class="card" id="cardTrajeto">
    <div class="section-label">
      🗺️ Trajeto
      <span class="locked-badge" id="trajetoLockBadge" style="display:none">📋 Ida registrada acima — adicione o retorno</span>
    </div>
    <div id="trajetoList"></div>
    <button class="btn-add" id="btnAddTrajeto" onclick="addTrajeto()">+ Adicionar Trajeto</button>
  </div>

  <!-- Submit -->
  <div class="card">
    <button class="btn-submit" id="btnSubmit" onclick="submeter()">▶ Registrar Início</button>
    <div id="resultArea"></div>
  </div>
</div>

<script>
  var SUBESTACOES=[], tipo='inicial', MAX_COLAB=6, osCount=0, trajetoCount=0;
  var _membrosFinais=[]; // nomes já resolvidos no modo final
  var TIPOS_TRAJETO=['Saída da base','Chegada na SE','Saída da SE','Chegada na base'];
  var _osFinaisPendente=null, _osFinaisCarregados={}, _aprFiles={};
  var _lookupTimer=null, _finalLocked=false;

  // ── Tema ──────────────────────────────────────────────────────────────────
  function toggleTema(){
    var l=document.body.classList.toggle('light');
    document.getElementById('btnTema').textContent=l?'🌑 Escuro':'🌙 Escuro';
    localStorage.setItem('tema_atv',l?'light':'dark');
  }
  if(localStorage.getItem('tema_atv')==='light') document.body.classList.add('light');

  // ── Init ──────────────────────────────────────────────────────────────────
  function autoHorario(){
    var h={'Manhã':'07h x 16h','Tarde':'14h x 23h','Noite':'23h x 07h','Técnicos da Guarda':''};
    document.getElementById('horario').value=h[document.getElementById('guarda').value]||'';
  }
  var hoje=new Date();
  document.getElementById('data').value=hoje.toISOString().split('T')[0];
  var DIAS=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  document.getElementById('diaSemana').value=DIAS[hoje.getDay()];
  document.getElementById('horario').value='07h x 16h';

  fetch('/api/subestacoes').then(function(r){return r.json();}).then(function(res){
    SUBESTACOES=res.data||[];
    addColab(); addOS();
  }).catch(function(){addColab();addOS();});

  // ── Tipo ──────────────────────────────────────────────────────────────────
  function setTipo(t){
    tipo=t;
    document.getElementById('tabInicial').className='type-tab'+(t==='inicial'?' active-inicial':'');
    document.getElementById('tabFinal').className='type-tab'+(t==='final'?' active-final':'');
    document.getElementById('btnSubmit').textContent=t==='inicial'?'▶ Registrar Início':'◀ Registrar Conclusão';
    document.getElementById('cardOsInicial').style.display=t==='inicial'?'':'none';
    document.getElementById('cardOsFinal').style.display=t==='final'?'':'none';
    document.getElementById('lookupCard').style.display=t==='final'?'':'none';
    if(t==='final'){
      // Reset
      document.getElementById('lookupInput').value='';
      document.getElementById('lookupInput').className='lookup-input';
      document.getElementById('lookupResult').style.display='none';
      document.getElementById('osListFinal').innerHTML='';
      document.getElementById('btnAddOsFinal').style.display='none';
      document.getElementById('resultArea').innerHTML='';
      _osFinaisCarregados={}; _finalLocked=false; _membrosFinais=[];
      unlockAll();
    }
  }

  // ── Lock/unlock fields ────────────────────────────────────────────────────
  function lockAll(){
    ['cardResenha','cardEquipe'].forEach(function(id){
      document.getElementById(id).classList.add('locked');
    });
    document.getElementById('resenhaLockBadge').style.display='';
    document.getElementById('equipeLockBadge').style.display='';
    document.getElementById('trajetoLockBadge').style.display='';
    // Trajeto NÃO é travado — colaborador pode adicionar pontos de retorno
    _finalLocked=true;
  }
  function unlockAll(){
    ['cardResenha','cardEquipe'].forEach(function(id){
      document.getElementById(id).classList.remove('locked');
    });
    document.getElementById('resenhaLockBadge').style.display='none';
    document.getElementById('equipeLockBadge').style.display='none';
    document.getElementById('trajetoLockBadge').style.display='none';
  }

  // ── OS Lookup ─────────────────────────────────────────────────────────────
  function onLookupInput(val){
    clearTimeout(_lookupTimer);
    var inp=document.getElementById('lookupInput');
    var res=document.getElementById('lookupResult');
    if(!val||val.trim().length<3){inp.className='lookup-input';res.style.display='none';return;}
    _lookupTimer=setTimeout(function(){
      fetch('/api/os').then(function(r){return r.json();}).then(function(data){
        var os=data.data.find(function(o){return o.os===val.trim();});
        if(os){
          inp.className='lookup-input ok';
          _osFinaisPendente=os;
          var planejado=(os.descricao_inicial||os.servico||'—').split(' | ')[0];
          res.className='lookup-result ok';
          res.style.display='block';
          // Bloqueia se Concluído
          if(os.status==='Concluído'){
            inp.className='lookup-input err';
            res.className='lookup-result err';
            res.style.display='block';
            res.innerHTML='⚠️ OS <strong>'+os.os+'</strong> já tem status <strong>Concluído</strong>.<br>Não é possível registrar nova conclusão.';
          } else {
            res.className='lookup-result ok';
            res.style.display='block';
            var statusBadge = os.status==='Andamento'
              ? '<span style="background:var(--orange-bg);color:var(--orange);border-radius:4px;padding:1px 7px;font-size:.75rem;font-weight:600">'+os.status+'</span>'
              : '<span style="background:var(--violet-bg);color:var(--violet);border-radius:4px;padding:1px 7px;font-size:.75rem;font-weight:600">'+os.status+'</span>';
            res.innerHTML=
              '<strong>OS '+os.os+'</strong> — '+(os.unidade||'')+' '+statusBadge+'<br>'+
              '👷 '+(os.equipe||'—')+'<br>'+
              '📆 '+(os.dia_semana||'')+(os.data?' — '+os.data:'')+'<br>'+
              '🚔 '+(os.veiculo||'—')+'<br>'+
              '📝 '+planejado+'<br>'+
              '<button class="btn-load" onclick="carregarOS()" style="margin-top:8px">✅ Carregar esta atividade</button>';
          }
        } else {
          inp.className='lookup-input err';
          res.className='lookup-result err';
          res.style.display='block';
          res.textContent='❌ OS "'+val.trim()+'" não encontrada. Verifique o número.';
        }
      }).catch(function(){});
    },600);
  }

  function carregarOS(){
    var os=_osFinaisPendente;
    if(!os) return;
    // Bloqueia se já está concluída
    if(os.status==='Concluído'){
      var res=document.getElementById('lookupResult');
      res.className='lookup-result err';
      res.style.display='block';
      res.innerHTML='⚠️ Esta OS já possui status <strong>Concluído</strong> no sistema.<br>Não é possível fazer um novo registro final.';
      document.getElementById('lookupInput').className='lookup-input err';
      _osFinaisPendente=null;
      return;
    }

    // Preenche campos gerais e trava
    if(os.guarda) document.getElementById('guarda').value=os.guarda;
    if(os.horario) document.getElementById('horario').value=os.horario;
    if(os.dia_semana) document.getElementById('diaSemana').value=os.dia_semana;
    if(os.data){var p=os.data.split('/');if(p.length===3)document.getElementById('data').value=p[2]+'-'+p[1]+'-'+p[0];}
    if(os.veiculo) document.getElementById('veiculo').value=os.veiculo;
    if(os.telefone) document.getElementById('telefone').value=os.telefone;

    // Armazena nomes já resolvidos para não precisar validar matrícula
    _membrosFinais = os.equipe ? os.equipe.split(',').map(function(n){return n.trim();}).filter(Boolean) : [];

    // Preenche colaboradores — mostra como texto fixo (nomes, não matrícula)
    if(os.equipe){
      var list=document.getElementById('colabList');
      list.innerHTML='';
      document.getElementById('btnAddColab').style.display='none';
      var nomes=os.equipe.split(',').map(function(n){return n.trim();}).filter(Boolean);
      nomes.forEach(function(nome){
        var wrap=document.createElement('div');
        wrap.className='colab-wrap';
        wrap.style.marginBottom='4px';
        wrap.innerHTML=
          '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:.9rem;color:var(--text);display:flex;align-items:center;gap:8px">'+
            '<span style="color:var(--green);font-size:.85rem">✓</span>'+
            '<span>'+nome+'</span>'+
          '</div>';
        list.appendChild(wrap);
      });
    }

    // Preenche trajeto da ida e trava
    // trajeto agora é campo separado; fallback para extração do servico (registros antigos)
    var trajetoStr = os.trajeto || '';
    if(!trajetoStr && os.servico && os.servico.includes('Trajeto:')){
      trajetoStr = os.servico.split('Trajeto:')[1].trim();
    }
    // Adiciona bloco do trajeto inicial só uma vez
    var tList=document.getElementById('trajetoList');
    if(!document.getElementById('trajetoInicial')){
    var div=document.createElement('div');
    div.className='trajeto-locked';
    div.id='trajetoInicial';
    div.innerHTML=
      '<div style="font-size:.7rem;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">'+
        '📍 Trajeto da Ida (registrado no início)'+
      '</div>'+
      (trajetoStr
        ? trajetoStr.split(' | ').filter(Boolean).map(function(t,i){
            // Detecta o tipo do ponto para sequência
            var tipoDetectado='';
            ['Saída da base','Chegada na SE','Saída da SE','Chegada na base'].forEach(function(tp){
              if(t.trim().startsWith(tp)) tipoDetectado=tp;
            });
            return '<div data-tipo="'+tipoDetectado+'" style="padding:5px 0;border-bottom:1px solid var(--border);font-size:.82rem;color:var(--text);display:flex;align-items:center;gap:8px">'+
              '<span style="color:var(--orange);font-size:.72rem;font-weight:700;min-width:16px">'+(i+1)+'.</span>'+
              '<span>'+t.trim()+'</span>'+
            '</div>';
          }).join('')
        : '<div style="padding:8px 0;color:var(--muted);font-size:.82rem;font-style:italic">Nenhum trajeto registrado no início</div>'
      );
    tList.insertBefore(div,tList.firstChild);
    if(!document.getElementById('trajetoRetornoLabel')){
      var sep=document.createElement('div');
      sep.style.cssText='font-size:.7rem;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px';
      sep.textContent='↩ Trajeto de Retorno — adicione abaixo';
      sep.id='trajetoRetornoLabel';
      tList.appendChild(sep);
    }
    } // end if !trajetoInicial

    // Trava todos os campos preenchidos
    lockAll();

    // Adiciona card de OS final apenas se ainda não estiver na lista
    if(!_osFinaisCarregados[os.os]){
      adicionarOSFinalCard(os);
      _osFinaisCarregados[os.os]=os;
    }

    // Limpa busca
    document.getElementById('lookupInput').value='';
    document.getElementById('lookupInput').className='lookup-input';
    document.getElementById('lookupResult').style.display='none';
    document.getElementById('btnAddOsFinal').style.display='';
    _osFinaisPendente=null;
  }

  function adicionarOSFinalCard(os){
    var list=document.getElementById('osListFinal');
    var planejado=(os.descricao_inicial||os.servico||'—').split(' | ')[0];
    var card=document.createElement('div');
    card.className='os-item';
    card.id='osf-'+os.os.replace(/[^a-z0-9]/gi,'_');
    card.innerHTML=
      '<div class="os-item-header">'+
        '<span class="os-item-num">🧰 OS '+os.os+' — '+(os.unidade||'')+'</span>'+
        '<button class="btn-remove" onclick="removerOSFinal(\''+os.os.replace(/'/g,"\\'")+'\')" >✕</button>'+
      '</div>'+
      '<input type="hidden" class="os-code" value="'+os.os+'"/>'+
      '<input type="hidden" class="os-db-id" value="'+os.id+'"/>'+
      '<div class="field">'+
        '<label style="color:var(--muted)">📋 O que foi planejado</label>'+
        '<textarea class="os-planejado-input" readonly style="opacity:.55;cursor:not-allowed;resize:none">'+planejado+'</textarea>'+
      '</div>'+
      '<div class="field">'+
        '<label style="color:var(--green)">✅ O que foi feito <span style="color:var(--red)">*</span></label>'+
        '<textarea class="os-feito-input" placeholder="Descreva o que foi executado..." rows="3"></textarea>'+
      '</div>'+
      '<div class="field" style="background:var(--orange-bg);border:1px solid var(--orange);border-radius:8px;padding:10px 12px">'+
        '<label style="color:var(--orange);font-size:.82rem;font-weight:700">⚠️ OBRIGATÓRIO — Selecione o status</label>'+
        '<select class="os-status-input status-select" onchange="updateStatusStyle(this)" style="margin-top:6px">'+
          '<option value="" disabled selected>-- Selecione o status --</option>'+
          '<option value="Concluído">Concluído</option>'+
          '<option value="Etapa Concluída">Etapa Concluída</option>'+
          '<option value="Cancelado">Cancelado</option>'+
        '</select>'+
      '</div>';
    list.appendChild(card);
    card.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  function removerOSFinal(osCode){
    var card=document.getElementById('osf-'+osCode.replace(/[^a-z0-9]/gi,'_'));
    if(card) card.remove();
    delete _osFinaisCarregados[osCode];
  }

  function addOutraOS(){
    document.getElementById('lookupInput').focus();
    document.getElementById('lookupCard').scrollIntoView({behavior:'smooth'});
  }

  // ── Colaboradores ─────────────────────────────────────────────────────────
  function addColab(){
    var list=document.getElementById('colabList');
    if(list.children.length>=MAX_COLAB) return;
    var idx=list.children.length;
    var wrap=document.createElement('div'); wrap.className='colab-wrap';
    wrap.innerHTML=
      '<div class="colab-row">'+
        '<input type="number" inputmode="numeric" placeholder="'+(idx===0?'Responsável':'Colaborador '+(idx+1))+
          '" class="colab-mat" oninput="lookupColab(this)"/>'+
        (idx>0?'<button class="btn-remove" onclick="removeColab(this)">✕</button>':'')+
      '</div>'+
      '<div class="colab-hint"></div>';
    list.appendChild(wrap);
    if(list.children.length>=MAX_COLAB) document.getElementById('btnAddColab').style.display='none';
  }
  function removeColab(btn){btn.closest('.colab-wrap').remove();document.getElementById('btnAddColab').style.display='';}
  function lookupColab(inp){
    var mat=inp.value.trim(), hint=inp.closest('.colab-wrap').querySelector('.colab-hint');
    if(mat.length>=4){
      fetch('/api/colaborador/'+mat).then(function(r){return r.json();}).then(function(res){
        if(res.data){inp.className='colab-mat ok';hint.className='colab-hint ok';hint.textContent='✓ '+res.data.nome;}
        else{inp.className='colab-mat err';hint.className='colab-hint err';hint.textContent='✗ Matrícula não encontrada';}
      }).catch(function(){});
    } else {inp.className='colab-mat';hint.className='colab-hint';hint.textContent='';}
  }
  function getColabs(){
    return Array.from(document.querySelectorAll('.colab-mat')).map(function(i){return i.value.trim();}).filter(Boolean);
  }

  // ── OS Início ─────────────────────────────────────────────────────────────
  function addOS(){
    osCount++;
    var n=osCount, list=document.getElementById('osList');
    var subOpts=SUBESTACOES.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('');
    var item=document.createElement('div'); item.className='os-item'; item.id='os-'+n;
    item.innerHTML=
      '<div class="os-item-header">'+
        '<span class="os-item-num">🧰 Atividade '+n+'</span>'+
        (n>1?'<button class="btn-remove" onclick="removeOS('+n+')">✕ Remover</button>':'')+
      '</div>'+
      '<div class="field"><label>Nº da OS</label><input type="text" class="os-num-input" placeholder="Ex: 3257260658" inputmode="numeric"/></div>'+
      '<div class="field"><label>Subestação</label><select class="os-sub-input">'+subOpts+'</select></div>'+
      '<div class="field"><label>📝 O que vai ser feito</label><textarea class="os-inicial-input" placeholder="Descreva o que será executado..."></textarea></div>';
    list.appendChild(item);
  }
  function removeOS(n){var el=document.getElementById('os-'+n);if(el)el.remove();}
  function updateStatusStyle(sel){sel.className='os-status-input status-select status-'+sel.value;}

  function getOSListInicial(){
    var seen={};
    return Array.from(document.querySelectorAll('#osList .os-item')).map(function(item){
      var os=(item.querySelector('.os-num-input')||{}).value||'';
      var unidade=(item.querySelector('.os-sub-input')||{}).value||'';
      var desc=((item.querySelector('.os-inicial-input')||{}).value||'').trim();
      return {os:os,unidade:unidade,servico:desc,descricao_inicial:desc,status:'Andamento'};
    }).filter(function(o){
      if(!o.servico&&!o.os) return false;
      var key=o.os||o.servico;
      if(seen[key]) return false;
      seen[key]=true;
      return true;
    });
  }
  function getOSListFinal(){
    return Array.from(document.querySelectorAll('#osListFinal .os-item')).map(function(item){
      var os=(item.querySelector('.os-code')||{}).value||'';
      var feito=((item.querySelector('.os-feito-input')||{}).value||'').trim();
      var status=(item.querySelector('.os-status-input')||{}).value||'Andamento';
      var osData=_osFinaisCarregados[os]||{};
      return {os:os,unidade:osData.unidade||'',servico:feito,descricao_final:feito,status:status};
    }).filter(function(o){return o.os;});
  }

  // ── Trajeto ───────────────────────────────────────────────────────────────
  var PROXIMOS_VALIDOS = {
    'Saída da base':   ['Chegada na SE'],
    'Chegada na SE':   ['Saída da SE'],
    'Saída da SE':     ['Chegada na SE','Chegada na base'],
    'Chegada na base': ['Saída da base'],
  };

  function getUltimoTipoTrajeto(){
    // Verifica pontos editáveis (não o bloco inicial bloqueado)
    var items=Array.from(document.querySelectorAll('.trajeto-item'));
    if(items.length) return items[items.length-1].querySelector('.traj-tipo').value;
    // Verifica último ponto do trajeto inicial (modo final)
    var blocoInicial=document.getElementById('trajetoInicial');
    if(blocoInicial){
      var pontos=Array.from(blocoInicial.querySelectorAll('[data-tipo]'));
      if(pontos.length) return pontos[pontos.length-1].getAttribute('data-tipo');
    }
    return null;
  }

  function addTrajeto(){
    var ultimo=getUltimoTipoTrajeto();
    // Primeiro ponto: sempre Saída da base
    var proximos = ultimo ? (PROXIMOS_VALIDOS[ultimo]||TIPOS_TRAJETO) : ['Saída da base'];

    trajetoCount++;
    var n=trajetoCount;
    var subOpts=SUBESTACOES.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('');
    // Só mostra opções válidas
    var tipoOpts=proximos.map(function(t){return '<option value="'+t+'">'+t+'</option>';}).join('');
    var now=new Date().toTimeString().slice(0,5);
    var item=document.createElement('div'); item.className='trajeto-item'; item.id='traj-'+n;
    item.innerHTML=
      '<select class="traj-tipo" onchange="onTipoChange(this)">'+tipoOpts+'</select>'+
      '<select class="sub-sel traj-se">'+subOpts+'</select>'+
      '<input type="time" class="traj-hora" value="'+now+'"/>'+
      '<button class="btn-remove" onclick="removeTrajeto('+n+')">✕</button>';
    document.getElementById('trajetoList').appendChild(item);
    toggleSeSel(item.querySelector('.traj-tipo'));
    item.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  function onTipoChange(sel){
    toggleSeSel(sel);
    // Atualiza o próximo item se existir
    var items=Array.from(document.querySelectorAll('.trajeto-item'));
    var idx=items.indexOf(sel.closest('.trajeto-item'));
    if(idx>=0 && idx<items.length-1){
      var next=items[idx+1];
      var proximos=PROXIMOS_VALIDOS[sel.value]||TIPOS_TRAJETO;
      var nextSel=next.querySelector('.traj-tipo');
      nextSel.innerHTML=proximos.map(function(t){return '<option value="'+t+'">'+t+'</option>';}).join('');
      nextSel.value=proximos[0];
      toggleSeSel(nextSel);
    }
  }
  function toggleSeSel(sel){
    var seEl=sel.closest('.trajeto-item').querySelector('.traj-se');
    seEl.style.display=sel.value.includes('SE')?'':'none';
  }
  function removeTrajeto(n){var el=document.getElementById('traj-'+n);if(el)el.remove();}
  function getTrajetoStr(){
    return Array.from(document.querySelectorAll('.trajeto-item')).map(function(item){
      var t2=item.querySelector('.traj-tipo').value;
      var hora=item.querySelector('.traj-hora').value;
      var seEl=item.querySelector('.traj-se');
      var se=(seEl&&seEl.style.display!=='none')?seEl.value:'';
      return t2+(se?' '+se:'')+(hora?' '+hora:'');
    }).filter(Boolean).join(' | ');
  }

  // ── Submit ────────────────────────────────────────────────────────────────
  var _submitting=false;
  var _lastSubmitTime=0;
  async function submeter(){
    var now=Date.now();
    if(_submitting || now-_lastSubmitTime < 3000) return; // bloqueia por 3s entre envios
    _submitting=true;
    _lastSubmitTime=now;
    var btn=document.getElementById('btnSubmit');
    var colabs=getColabs();
    var osList=tipo==='inicial'?getOSListInicial():getOSListFinal();

    if(tipo==='inicial' && !colabs.length){showMsg('Informe pelo menos um colaborador.','err');return;}
    if(tipo==='final' && _membrosFinais.length===0 && !colabs.length){showMsg('Carregue uma OS primeiro.','err');return;}
    if(!osList.length){showMsg(tipo==='final'?'Carregue pelo menos uma OS para finalizar.':'Adicione pelo menos uma atividade.','err');return;}
    if(tipo==='inicial'&&osList.some(function(o){return !o.descricao_inicial;})){showMsg('Preencha "O que vai ser feito".','err');return;}
    // Status is always Andamento for inicial — no need to validate
    if(tipo==='final'&&osList.some(function(o){return !o.descricao_final;})){showMsg('Preencha "O que foi feito" em todas as atividades.','err');return;}
    if(tipo==='final'&&osList.some(function(o){return !o.status||o.status==='Andamento'||o.status==='';})){showMsg('⚠️ Selecione o Status de todas as atividades antes de finalizar.','err');return;}

    btn.disabled=true; btn.textContent='⏳ Registrando...';
    console.log('[SUBMIT] tipo:', tipo, 'ordens:', osList.length, JSON.stringify(osList.map(function(o){return o.os;})));
    // Dedup client-side
    var seenOs={}; osList=osList.filter(function(o){ var k=o.os||o.servico; if(seenOs[k]) return false; seenOs[k]=true; return true; });
    console.log('[SUBMIT] após dedup:', osList.length, 'ordens');

    var membros=[];
    // No modo Final com OS carregada, usa os nomes já resolvidos
    if(tipo==='final' && _membrosFinais.length>0){
      membros = _membrosFinais.slice();
    } else {
      // Modo Inicial — valida matrículas normalmente
      if(!colabs.length){showMsg('Informe pelo menos um colaborador.','err');btn.disabled=false;btn.textContent=tipo==='inicial'?'▶ Registrar Início':'◀ Registrar Conclusão';return;}
      for(var i=0;i<colabs.length;i++){
        try{
          var r1=await fetch('/api/colaborador/'+colabs[i]).then(function(r){return r.json();});
          if(!r1.data){showMsg('Matrícula '+colabs[i]+' não encontrada.','err');btn.disabled=false;btn.textContent=tipo==='inicial'?'▶ Registrar Início':'◀ Registrar Conclusão';return;}
          membros.push(r1.data.nome);
        }catch(e){showMsg('Erro ao validar matrícula.','err');btn.disabled=false;return;}
      }
    }

    var dp=document.getElementById('data').value.split('-');
    var payload={
      tipo:tipo,
      guarda:document.getElementById('guarda').value,
      horario:document.getElementById('horario').value,
      dia_semana:document.getElementById('diaSemana').value,
      data:dp[2]+'/'+dp[1]+'/'+dp[0],
      equipe:membros.join(', '),
      telefone:document.getElementById('telefone').value.trim(),
      veiculo:document.getElementById('veiculo').value.trim(),
      trajeto:getTrajetoStr(),
      ordens:osList,
    };

    try{
      var result=await fetch('/api/atividade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json();});
      if(!result.ok) throw new Error(result.error||'Erro desconhecido');
      showMsg('✅ '+(tipo==='inicial'?'Início':'Conclusão')+' registrado!\nEquipe: '+membros.join(', '),'ok');
      mostrarCardsAPR(result.registradas||[]);
    }catch(e){showMsg('❌ Erro: '+e.message,'err');}

    btn.disabled=false;
    btn.textContent=tipo==='inicial'?'▶ Registrar Início':'◀ Registrar Conclusão';

  }

  function showMsg(msg,type){
    var area=document.getElementById('resultArea');
    var div=document.createElement('div'); div.className='result-msg '+type; div.textContent=msg;
    area.insertBefore(div,area.firstChild);
    div.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  // ── APR ───────────────────────────────────────────────────────────────────
  function mostrarCardsAPR(registradas){
    var area=document.getElementById('resultArea');
    registradas.forEach(function(r,i){
      var osCode=r.os||'';
      var label=osCode.match(/^\d{6,}$/)?'OS '+osCode:'Atividade '+(i+1);
      var card=document.createElement('div'); card.className='apr-card'; card.id='aprCard_'+i;
      card.innerHTML=
        '<div class="apr-card-title">📎 APR — '+label+
          '<span class="apr-status pendente" id="aprStatus_'+i+'">pendente</span></div>'+
        '<p style="font-size:.75rem;color:var(--muted)">'+(r.unidade||'')+' — '+(r.servico||'').substring(0,60)+'</p>'+
        '<div class="apr-sides">'+
          '<div><div class="apr-side-title">Frente <span style="color:var(--red)">*</span></div>'+
            '<img class="apr-preview" id="aprPrevF_'+i+'"/>'+
            '<div class="apr-upload-row">'+
              '<label class="apr-lbl" id="aprLFC_'+i+'"><input type="file" accept="image/*" capture="environment" onchange="previewAprCard('+i+',\'frente\',this)"/>📸</label>'+
              '<label class="apr-lbl" id="aprLFG_'+i+'"><input type="file" accept="image/*" onchange="previewAprCard('+i+',\'frente\',this)"/>🖼️</label>'+
            '</div></div>'+
          '<div><div class="apr-side-title">Verso <span style="color:var(--red)">*</span></div>'+
            '<img class="apr-preview" id="aprPrevV_'+i+'"/>'+
            '<div class="apr-upload-row">'+
              '<label class="apr-lbl" id="aprLVC_'+i+'"><input type="file" accept="image/*" capture="environment" onchange="previewAprCard('+i+',\'verso\',this)"/>📸</label>'+
              '<label class="apr-lbl" id="aprLVG_'+i+'"><input type="file" accept="image/*" onchange="previewAprCard('+i+',\'verso\',this)"/>🖼️</label>'+
            '</div></div>'+
        '</div>'+
        '<button class="btn-apr-send" id="btnApr_'+i+'" disabled style="display:none" onclick="enviarAprCard('+i+',\''+osCode.replace(/'/g,"\\'")+'\')">📤 Enviar APR (Frente + Verso)</button>';
      area.appendChild(card);
    });
  }

  function previewAprCard(idx,side,input){
    var file=input.files[0]; if(!file) return;
    _aprFiles[idx+'_'+side]=file;
    var img=document.getElementById(side==='frente'?'aprPrevF_'+idx:'aprPrevV_'+idx);
    if(img){img.src=URL.createObjectURL(file);img.style.display='block';}
    input.closest('label').classList.add('done');
    if(_aprFiles[idx+'_frente']&&_aprFiles[idx+'_verso']){
      var btn=document.getElementById('btnApr_'+idx);
      btn.style.display='block'; btn.disabled=false;
    }
  }

  async function enviarAprCard(idx,osCode){
    var btn=document.getElementById('btnApr_'+idx);
    btn.disabled=true; btn.textContent='⏳ Enviando...';
    try{
      var res=await fetch('/api/os').then(function(r){return r.json();});
      var os=res.data.find(function(o){return o.os===osCode;});
      if(!os) throw new Error('OS não encontrada: '+osCode);
      if(_aprFiles[idx+'_frente']){var fd1=new FormData();fd1.append('apr',_aprFiles[idx+'_frente']);await fetch('/api/os/'+os.id+'/apr',{method:'POST',body:fd1});}
      if(_aprFiles[idx+'_verso']){var fd2=new FormData();fd2.append('apr',_aprFiles[idx+'_verso']);await fetch('/api/os/'+os.id+'/apr-verso',{method:'POST',body:fd2});}
      document.getElementById('aprCard_'+idx).classList.add('done');
      var st=document.getElementById('aprStatus_'+idx);
      if(st){st.textContent='✓ enviada';st.className='apr-status enviada';}
      btn.style.display='none';
      var done=document.createElement('p');done.className='apr-done-msg';done.textContent='✅ APR enviada com sucesso';
      document.getElementById('aprCard_'+idx).appendChild(done);
    }catch(e){alert('Erro: '+e.message);btn.disabled=false;btn.textContent='📤 Enviar APR';}
  }
</script>
</body>
</html>
